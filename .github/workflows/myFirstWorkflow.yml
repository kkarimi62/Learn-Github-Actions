name:  ci pipeline

on: 
 push:
  branches: 
   - main
   - dev
 pull_request:
  branches:
    - main
    - dev
 workflow_dispatch: 

jobs:
   reuse-workflow:
   
    permissions:
      contents: read
      actions: read
      security-events: write
      
    uses: kkarimi62/Reusable-workflows/.github/workflows/ci-pipeline.yml@main
    with:
      my-first-job-input: true
    secrets: 
      APP_PASSWD: ${{ secrets.APP_PASSWD }}
      DOCKER_USER: ${{ secrets.DOCKER_USER }}
      DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
