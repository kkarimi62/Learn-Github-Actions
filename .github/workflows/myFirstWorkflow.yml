name: my-firstworkflow

on: 
 push:
  branches: 
   - main
   - dev
 pull_request:
  branches:
    - main
    - dev
 workflow_dispatch: 
 

jobs:
  my-first-job:
   name: My first job
   runs-on: ubuntu-latest
   steps:
     - name: step-1
       run: |
        echo "hello" >> ./my_artifact.txt
        ls -ltr
        hostname
     - name: step-2 checkout
       uses: actions/checkout@v6.1.0
     - name: step-3
       run: git status
     - name: step-4 upload a single file
       uses: actions/upload-artifact@v7.0.1
       with:
         name: single_file
         path: ./my_artifact.txt
     - name: step-5 fail a job
       run: exit 1
   

    
        
        
   
   
